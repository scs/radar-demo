[defaults]
callback_plugins = plugins/callbacks
callback_enabled = auto_tags

[privilege_escalation]
# Ubuntu 26.04 defaults to sudo-rs, whose password prompt the sudo become
# plugin in ansible-core 2.20 doesn't recognize, causing become to time out.
# Force the classic sudo binary (still installed alongside sudo-rs) for become.
become_exe = /usr/bin/sudo.ws
