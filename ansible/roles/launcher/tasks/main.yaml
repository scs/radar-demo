- name: Place the start_demo script in $HOME
  become: false
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      set -e
      SCRIPT=$(readlink -f "$0")
      SCRIPTPATH=$(dirname "$SCRIPT")
      cd {{ playbook_dir }}/../backend || exit 1
      eval "$(direnv export bash)"
      killall python3 || true
      direnv allow .
      if ! poetry install; then
        notify-send -u critical "Radar Demo" "poetry install failed, see terminal for details" || true
        exit 1
      fi
      cd /
      cd {{ playbook_dir }}/../backend || exit 1
      python3 run.py &
      server_pid=$!
      google-chrome --app=http://127.0.0.1:5000 --password-store=basic --start-fullscreen
      kill $server_pid
    dest: ~/start_demo.sh
    mode: '0755'
- name: Place the icon in $HOME/.local/share
  become: false
  ansible.builtin.copy:
    src: radar.png
    dest: ~/.local/share/radar.png
    mode: '0644'
- name: Create applications directory
  become: false
  ansible.builtin.file:
    path: ~/.local/share/applications
    state: directory
- name: Create launcher script
  become: false
  ansible.builtin.copy:
    dest: ~/.local/share/applications/radar-demo.desktop
    content: |
      [Desktop Entry]
      Type=Application
      #Terminal=true
      Name=Radar Demo
      Icon=/home/{{ ansible_facts['user_id'] }}/.local/share/radar.png
      Exec=/home/{{ ansible_facts['user_id'] }}/start_demo.sh
    mode: '0644'
- name: Create autostart directory
  become: false
  ansible.builtin.file:
    path: ~/.config/autostart
    state: directory
- name: Create autostart launcher script
  become: false
  ansible.builtin.copy:
    dest: ~/.config/autostart/radar-demo.desktop
    content: |
      [Desktop Entry]
      Type=Application
      #Terminal=true
      Name=Radar Demo
      Icon=/home/{{ ansible_facts['user_id'] }}/.local/share/radar.png
      Exec=/home/{{ ansible_facts['user_id'] }}/start_demo.sh
    mode: '0644'
- name: Find gnome-keyring autostart entries
  become: false
  ansible.builtin.find:
    paths: /etc/xdg/autostart
    patterns: "gnome-keyring-*.desktop"
  register: keyring_autostart_entries
- name: Disable gnome-keyring autostart
  become: false
  # Autologin never unlocks the login keyring (no password is ever typed),
  # so the first thing that touches the secret service pops up a manual
  # unlock prompt. Nothing in this kiosk setup needs it (Chrome is already
  # configured with --password-store=basic), so just disable it entirely.
  ansible.builtin.copy:
    dest: "~/.config/autostart/{{ item.path | basename }}"
    content: |
      [Desktop Entry]
      Hidden=true
    mode: '0644'
  loop: "{{ keyring_autostart_entries.files }}"
