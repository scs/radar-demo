- name: Setup Radar Demo
  hosts: dev
  vars:
    # Version of the currently running kernel, e.g. "7.0.0-43" (flavor suffix stripped)
    kernel: "{{ ansible_facts['kernel'] | regex_replace('-generic$', '') }}"
    repo_dir: "{{ playbook_dir | dirname }}"
    # Dedicated venv for radardemoinfra, used by scripts that run outside the
    # backend's own poetry venv (update_fw.py, socat_forward.py). Must match
    # the shebang in those scripts.
    radardemoinfra_venv: /opt/radardemoinfra/venv
  roles:
    - role: distupgrade
    - role: git
    - role: bash
    - role: sshd
    - role: launcher
    - role: kernel
    - role: libqdma
    - role: udev
    - role: pyenv
    - role: direnv
    - role: python
    - role: poetry
    - role: radardemo_py_infra
    - role: socat
    - role: grub
    - role: google-chrome
    - role: network_config
  tasks:
    - name: Install System Packages
      become: true
      ansible.builtin.package:
        name:
          - chromium-browser
          - curl
          - htop
          - git
          - vim
        state: present
